appId: com.openpipal.app
productName: OpenPipal
directories:
  buildResources: resources
files:
  # 正向白名单 —— 只有这里列出的才进 app.asar。
  # 为什么不是排除列表：同一个洞撞过三次（dist-qa* 把 152MB 的包吹成 1.2GB / 48K 品牌素材 zip /
  # 一次诊断命令落在仓库根的 2.5MB 散落 chunk）。排除列表要求预测未来会出现什么文件；
  # 白名单只要求列清运行时需要什么 —— 后者是封闭、可枚举、可证明的集合。
  # 依据：package.json 的 main = out/main/index.js；其余运行时资源（dc-runtime / skills /
  # tray / system-agents）一律走 process.resourcesPath，属于 extraResources，在 asar 之外。
  # 改这里必须重跑 asar list 对照实验，确认差集只有预期项（见 .claude/skills/release）。
  - 'out/**'
  - 'node_modules/**'
  - 'package.json'
  # 主动保留：许可合规随包分发
  - 'LICENSE'
  - 'THIRD_PARTY_NOTICES.md'
  # 运行时编译器（artifact-store/ds-compile 的 require('esbuild'|'typescript')）进包但裁剪：
  # typescript 只需 lib/typescript.js —— createSourceFile 纯语法解析，不加载默认库/locale/tsc
  - '!node_modules/typescript/lib/_ts*.js'
  - '!node_modules/typescript/lib/lib*.d.ts'
  - '!node_modules/typescript/lib/{cs,de,es,fr,it,ja,ko,pl,pt-br,ru,tr,zh-cn,zh-tw}/**'
  # esbuild/bin 是 @esbuild 平台包二进制的重复硬链接（打包会materialize成双份），JS API 只走 @esbuild
  - '!node_modules/esbuild/bin/**'
asarUnpack:
  # esbuild 同步 API 用 new Worker(__filename) 自举 + spawn @esbuild/<平台>/bin/esbuild，
  # worker_threads 与 exec 都吃不了 asar 内路径 —— 两个包必须整体落成真实文件
  - '**/node_modules/esbuild/**'
  - '**/node_modules/@esbuild/**'
mac:
  # Electron 43 no longer supports macOS 11. Keep the packaged requirement explicit.
  minimumSystemVersion: '12.0'
  # Release signing must use the checked-in, reviewed entitlement contract.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  extendInfo:
    NSScreenCaptureUsageDescription: "OpenPipal uses screen recording only when you ask it to inspect a target application window."
    NSMicrophoneUsageDescription: "OpenPipal uses the microphone only when you start voice input or live interpretation."
    NSCameraUsageDescription: "OpenPipal uses the camera only when you approve camera access for an embedded MCP App."
    NSLocationUsageDescription: "OpenPipal uses your location only when you approve location access for an embedded MCP App."
    NSLocationWhenInUseUsageDescription: "OpenPipal uses your location only when you approve location access for an embedded MCP App."
    NSAppleEventsUsageDescription: "OpenPipal uses Apple Events to inspect, focus, and paste into the target application you choose."
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # pi-coding-agent 的图片读取器会在 Photon 模块加载时从 process.execPath 同目录兜底找 WASM。
  # electron-vite 只打进 JS chunk，不会自动复制这个二进制资源；缺失时所有图片都会误报"无法缩小"。
  # npm 嵌套/提升位置都列上——缺席的那条只警告不报错，哪条存在拷哪条。
  extraFiles:
    - from: node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm
      to: MacOS/photon_rs_bg.wasm
    - from: node_modules/@earendil-works/pi-coding-agent/node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm
      to: MacOS/photon_rs_bg.wasm
extraResources:
  # dc 渲染/导出运行时 —— dc-export.ts / dc-headless.ts 打包态读 process.resourcesPath/dc-runtime；
  # 漏掉会导致正式版导出 ENOENT（vendor/react.production.min.js 找不到）
  - from: resources/dc-runtime
    to: dc-runtime
    filter: ['**/*', '!backup-pre-w1/**']
  - from: resources/skills
    to: skills
    filter: ['**/*']
  # Apache 2.0 attribution for bundled skills from openai/skills.
  # Must ship inside the distributed app so downstream users can find the license notice.
  # 托盘 template 图 —— index.ts createTray 打包态读 process.resourcesPath/tray
  - from: resources/tray
    to: tray
  - from: resources/SKILLS-NOTICE.md
    to: SKILLS-NOTICE.md
  - from: resources/system-agents
    to: system-agents
    filter: ['**/*']
  # subagent 档位定义 — 首启 seed 到 ~/.openpipal/subagents/
  - from: resources/subagents
    to: subagents
    filter: ['**/*']
  # 分发版本专用的 MCP 配置(精简版,不含内部业务 server)。
  # 运行时 loadConfig() 读 process.resourcesPath/mcp-servers.json。
  # 仓库根的 mcp-servers.json 仅在 dev 模式 (__dirname/../../) 被读到,二者独立。
  - from: resources/mcp-servers.json
    to: mcp-servers.json
  # ACP 适配器 —— 编辑器直接 spawn 它接管 ACP 协议（见 src/main/acp-adapter-launch.ts）。
  # 随包分发是为了让用户不必先装 Node 再 npm i -g：App 自带的 Electron 就是 Node
  # （ELECTRON_RUN_AS_NODE=1）。dist/index.js 是 tsup 打好的单文件，ACP SDK 已内联，
  # 只依赖 Node 内置模块，所以一个文件就够，不用带 node_modules。
  # 改名 .mjs 是必需的：Resources 目录下没有 package.json，.js 会被当成 CommonJS，
  # 第一行 import 直接语法报错。源文件由 package.json 的 build:acp 在打包前产出。
  - from: openpipal-acp/dist/index.js
    to: acp/openpipal-acp.mjs
  # Localized macOS privacy prompts. The top-level Info.plist values above remain the fallback.
  - from: resources/mac/en.lproj/InfoPlist.strings
    to: en.lproj/InfoPlist.strings
  - from: resources/mac/zh-Hans.lproj/InfoPlist.strings
    to: zh-Hans.lproj/InfoPlist.strings
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
