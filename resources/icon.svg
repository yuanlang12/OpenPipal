<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenPipal macOS 应用图标源文件。
  形取自品牌素材包 resources/brand/agent-mark-source.svg：墨色瓷砖 + 两只微斜的白眼。
  两个 rect 是原文件逐字抄过来的（含绕左上角的 rotate），只整体放大 824/64 = 12.875 倍。

  唯一的偏离：圆角用 Apple 的 squircle 近似（824 瓷砖 rx=185 ≈ 22.4%）而不是素材包的
  rx=4 ≈ 6.25%。理由是 Big Sur 之后 Dock 里所有图标都是 squircle，保留 6.25% 会显得
  没对齐系统。眼睛不动，所以身份还在。素材包禁止的是「把 mark 套进另一个圆角容器」——
  这里是同一块瓷砖换半径，不是套娃。

  重新生成 icns：node scripts/render-app-icon.cjs && ls resources/icon.icns
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#171714"/>
  <g transform="translate(100 100) scale(12.875)">
    <rect x="17" y="18" width="10" height="22" rx="5" transform="rotate(-11 17 18)" fill="#fff"/>
    <rect x="38" y="14" width="10" height="22" rx="5" transform="rotate(-18 38 14)" fill="#fff"/>
  </g>
</svg>
